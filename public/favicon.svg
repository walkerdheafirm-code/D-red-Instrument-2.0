<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dred-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4E"/>
      <stop offset="100%" stop-color="#9E1026"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A181C"/>
      <stop offset="100%" stop-color="#0A090B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C81E3A" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge / Studio Pad -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg-grad)" stroke="#C81E3A" stroke-width="3"/>

  <!-- Bold modern 'D' shaped outer contour -->
  <path d="M18 16 h13 c8 0 14.5 5.8 14.5 16 s-6.5 16 -14.5 16 H18 Z" fill="none" stroke="url(#dred-grad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Audio Equalizer Wave Bars inside the D mark -->
  <rect x="23" y="27" width="3" height="10" rx="1.5" fill="#FF4D6D"/>
  <rect x="28.5" y="22" width="3.5" height="20" rx="1.75" fill="#FF2A4E"/>
  <rect x="34.5" y="26" width="3" height="12" rx="1.5" fill="#FF4D6D"/>

  <!-- Crimson Apostrophe mark for D' -->
  <circle cx="51" cy="18" r="3.5" fill="#FF2A4E" filter="url(#glow)"/>
</svg>